<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="50%" style="stop-color:#0A2540"/>
      <stop offset="100%" style="stop-color:#0D1B2A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E7C7B"/>
      <stop offset="100%" style="stop-color:#14A9A8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#D4A017"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A5C44"/>
      <stop offset="100%" style="stop-color:#22C06B"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#14A9A8;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#14A9A8;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#22C06B;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#22C06B;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#14A9A8" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- ── LEFT: Data Centre block ── -->
  <rect x="80" y="140" width="160" height="120" rx="8" fill="#0C1E33" stroke="#1D5FA8" stroke-width="1.5"/>
  <!-- server rack rows -->
  <rect x="95" y="155" width="130" height="12" rx="2" fill="#1D5FA8" opacity="0.7"/>
  <rect x="95" y="173" width="130" height="12" rx="2" fill="#1D5FA8" opacity="0.5"/>
  <rect x="95" y="191" width="130" height="12" rx="2" fill="#1D5FA8" opacity="0.7"/>
  <rect x="95" y="209" width="130" height="12" rx="2" fill="#1D5FA8" opacity="0.5"/>
  <rect x="95" y="227" width="130" height="12" rx="2" fill="#1D5FA8" opacity="0.7"/>
  <!-- blinking LEDs -->
  <circle cx="108" cy="161" r="3" fill="#22C06B"/><circle cx="120" cy="161" r="3" fill="#22C06B" opacity="0.5"/>
  <circle cx="108" cy="179" r="3" fill="#14A9A8"/><circle cx="120" cy="179" r="3" fill="#14A9A8" opacity="0.5"/>
  <circle cx="108" cy="197" r="3" fill="#22C06B"/><circle cx="120" cy="197" r="3" fill="#22C06B"/>
  <circle cx="108" cy="215" r="3" fill="#14A9A8"/><circle cx="120" cy="215" r="3" fill="#14A9A8" opacity="0.7"/>
  <circle cx="108" cy="233" r="3" fill="#22C06B" opacity="0.6"/><circle cx="120" cy="233" r="3" fill="#22C06B"/>
  <text x="160" y="275" text-anchor="middle" fill="#7A96B8" font-family="monospace" font-size="11">AI Servers</text>

  <!-- ── CIRCULAR LOOP ARROWS (center) ── -->
  <!-- Outer ring -->
  <circle cx="520" cy="200" r="130" fill="none" stroke="#14A9A8" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <!-- Inner ring -->
  <circle cx="520" cy="200" r="80" fill="none" stroke="#1D5FA8" stroke-width="1" stroke-dasharray="4,6" opacity="0.25"/>

  <!-- Circular arrows - top arc (heat to ORC) -->
  <path d="M 430 145 Q 450 80 520 70 Q 590 80 610 145" fill="none" stroke="url(#teal)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="615,148 605,132 623,136" fill="#14A9A8"/>

  <!-- Circular arrows - bottom arc (cool water return) -->
  <path d="M 615 255 Q 590 320 520 330 Q 450 320 430 255" fill="none" stroke="url(#green)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="425,252 415,268 433,264" fill="#22C06B"/>

  <!-- Center label -->
  <circle cx="520" cy="200" r="55" fill="#0C1E33" stroke="#14A9A8" stroke-width="1.5"/>
  <text x="520" y="192" text-anchor="middle" fill="#14A9A8" font-family="monospace" font-size="11" font-weight="bold">CIRCULAR</text>
  <text x="520" y="208" text-anchor="middle" fill="#14A9A8" font-family="monospace" font-size="11" font-weight="bold">AI NODE</text>
  <text x="520" y="224" text-anchor="middle" fill="#7A96B8" font-family="monospace" font-size="9">ZERO WASTE</text>

  <!-- ── ORC TURBINE (top) ── -->
  <rect x="455" y="30" width="130" height="60" rx="6" fill="#0C1E33" stroke="#D4A017" stroke-width="1.5"/>
  <circle cx="490" cy="60" r="18" fill="none" stroke="#D4A017" stroke-width="1.5"/>
  <path d="M490,46 L494,56 L504,52 L498,62 L508,66 L497,68 L493,78 L489,68 L479,72 L484,62 L474,58 L485,55 Z" fill="#D4A017" opacity="0.8"/>
  <text x="530" y="56" text-anchor="middle" fill="#D4A017" font-family="monospace" font-size="10" font-weight="bold">ORC</text>
  <text x="530" y="70" text-anchor="middle" fill="#7A96B8" font-family="monospace" font-size="9">TURBINE</text>
  <!-- heat arrow down to ORC -->
  <line x1="430" y1="140" x2="490" y2="95" stroke="#D4A017" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="445" y="115" fill="#D4A017" font-family="monospace" font-size="9">HEAT →</text>

  <!-- ── ZLD PLANT (bottom) ── -->
  <rect x="455" y="310" width="130" height="60" rx="6" fill="#0C1E33" stroke="#22C06B" stroke-width="1.5"/>
  <circle cx="520" cy="340" r="12" fill="none" stroke="#22C06B" stroke-width="1.5"/>
  <path d="M520,328 C510,334 506,344 512,352 C516,358 524,358 528,352 C534,344 530,334 520,328Z" fill="#22C06B" opacity="0.7"/>
  <text x="545" y="336" fill="#22C06B" font-family="monospace" font-size="10" font-weight="bold">ZLD</text>
  <text x="545" y="350" fill="#7A96B8" font-family="monospace" font-size="9">TREATMENT</text>

  <!-- ── RIGHT: OUTPUTS ── -->
  <!-- Electricity output -->
  <rect x="900" y="60" width="200" height="80" rx="8" fill="#0C1E33" stroke="#D4A017" stroke-width="1.5"/>
  <text x="1000" y="88" text-anchor="middle" fill="#D4A017" font-family="sans-serif" font-size="22" font-weight="bold">⚡</text>
  <text x="1000" y="110" text-anchor="middle" fill="#D4A017" font-family="monospace" font-size="11" font-weight="bold">Rs. 7.68 L / yr</text>
  <text x="1000" y="126" text-anchor="middle" fill="#7A96B8" font-family="monospace" font-size="9">ORC ELECTRICITY REVENUE</text>

  <!-- Water saving output -->
  <rect x="900" y="160" width="200" height="80" rx="8" fill="#0C1E33" stroke="#14A9A8" stroke-width="1.5"/>
  <text x="1000" y="188" text-anchor="middle" fill="#14A9A8" font-family="sans-serif" font-size="22" font-weight="bold">💧</text>
  <text x="1000" y="210" text-anchor="middle" fill="#14A9A8" font-family="monospace" font-size="11" font-weight="bold">30M Gal Saved / yr</text>
  <text x="1000" y="226" text-anchor="middle" fill="#7A96B8" font-family="monospace" font-size="9">ZERO LIQUID DISCHARGE</text>

  <!-- CO2 output -->
  <rect x="900" y="260" width="200" height="80" rx="8" fill="#0C1E33" stroke="#22C06B" stroke-width="1.5"/>
  <text x="1000" y="288" text-anchor="middle" fill="#22C06B" font-family="sans-serif" font-size="22" font-weight="bold">🌿</text>
  <text x="1000" y="310" text-anchor="middle" fill="#22C06B" font-family="monospace" font-size="11" font-weight="bold">283 Tonnes CO₂ / yr</text>
  <text x="1000" y="326" text-anchor="middle" fill="#7A96B8" font-family="monospace" font-size="9">CARBON OFFSET</text>

  <!-- Connecting lines from center to outputs -->
  <line x1="650" y1="170" x2="895" y2="100" stroke="#D4A017" stroke-width="1" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="650" y1="200" x2="895" y2="200" stroke="#14A9A8" stroke-width="1" stroke-dasharray="5,3" opacity="0.6"/>
  <line x1="650" y1="230" x2="895" y2="300" stroke="#22C06B" stroke-width="1" stroke-dasharray="5,3" opacity="0.6"/>

  <!-- Lines from server to loop -->
  <line x1="240" y1="200" x2="385" y2="200" stroke="#1D5FA8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="385,195 398,200 385,205" fill="#14A9A8"/>

  <!-- ── TOP TITLE ── -->
  <text x="520" y="24" text-anchor="middle" fill="#E8EEF7" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="2">CIRCULAR AI ENERGY &amp; WATER PLANT</text>

  <!-- ── BOTTOM KPI STRIP ── -->
  <rect x="60" y="368" width="1080" height="26" rx="4" fill="#0C1E33" stroke="#1D5FA8" stroke-width="1" opacity="0.8"/>
  <text x="200" y="385" text-anchor="middle" fill="#7A96B8" font-family="monospace" font-size="10">CAPEX: Rs.106.46 Cr</text>
  <text x="400" y="385" text-anchor="middle" fill="#22C06B" font-family="monospace" font-size="10">OPEX SAVING: −67%</text>
  <text x="600" y="385" text-anchor="middle" fill="#D4A017" font-family="monospace" font-size="10">PAYBACK: 5.4 YRS</text>
  <text x="800" y="385" text-anchor="middle" fill="#14A9A8" font-family="monospace" font-size="10">15-YR NPV: Rs.51.77 Cr</text>
  <text x="1000" y="385" text-anchor="middle" fill="#22C06B" font-family="monospace" font-size="10">COMMUNITY: Rs.21.97 L/yr</text>
</svg>
